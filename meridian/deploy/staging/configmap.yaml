apiVersion: v1
kind: ConfigMap
metadata:
  name: meridian-config
  namespace: meridian-staging
data:
  # Non-secret configuration only. Credentials belong in meridian-secrets, which is not in this
  # repository — see README.md.
  OTLP_TRACES_ENABLED: "true"
  OTLP_TRACES_ENDPOINT: "http://otel-collector.observability:4318/v1/traces"
  SPRING_JPA_OPEN_IN_VIEW: "false"
