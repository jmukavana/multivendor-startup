spring:
  application:
    name: meridian
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

# NFR-11 requires structured logging, distributed tracing and metrics to be in place from first
# deployment, not added once something is slow. NFR-12 raises payment reconciliation variance,
# settlement failure and invoice transmission failure to priority incidents, which needs metrics
# that exist before those features do.
#
# Trace context also carries the traceId the frontend surfaces in its API error envelope
# (meridian-frontend: shared/api/types.ts, ApiMeta.traceId), so a buyer-reported failure can be
# traced from the browser through to the module that failed.
logging:
  structured:
    format:
      # JSON on stdout for the container runtime to collect. Human-readable output is restored in
      # the local profile below; a developer should not have to read JSON in a terminal.
      console: ecs
  level:
    org.springframework.modulith: INFO

management:
  endpoints:
    web:
      exposure:
        # Not a public surface. In staging and production these are served on a separate port and
        # firewalled; see the deployment manifests before exposing anything further.
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      # Every request is sampled until there is traffic worth sampling from. Lower it in production
      # once volume makes full capture expensive; at launch volumes the data is worth more than the
      # cost, and a 1% sample of a failure that happens twice a day tells you nothing.
      probability: 1.0
  opentelemetry:
    resource-attributes:
      service.name: meridian
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          # A real, syntactically valid default, not an empty string. `OtlpTracingConfigurations
          # .ConnectionDetails` (spring-boot-micrometer-tracing-opentelemetry) is gated by
          # `@ConditionalOnProperty("...otlp.endpoint")`, which treats ANY present value — including
          # ""  — as "on", so a bare `${OTLP_TRACES_ENDPOINT:}` here (this key's value before this
          # fix) always activated the OTLP exporter bean, which then failed to even construct:
          # OtlpHttpSpanExporterBuilder rejects an empty endpoint with "Invalid endpoint, must start
          # with http:// or https://", crashing application startup outright — every time, with no
          # env var set. This was invisible all session because @SpringBootTest disables tracing
          # autoconfiguration by default, so every test that boots the full context (WalkingSkeleton
          # FlowTests included) never exercises this path; found by actually running the app via
          # `./gradlew bootTestRun`, not by any automated test. http://localhost:4318 is the OTel
          # SDK's own conventional local-collector address: syntactically valid, so the exporter
          # bean now constructs and startup succeeds; if nothing is actually listening there (true
          # for a bare local/test run), individual span exports fail silently in the background —
          # BatchSpanProcessor logs and drops them — which is what "nothing is exported and startup
          # is unaffected" was always meant to describe. Set to a real collector URL per environment.
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318}
  otlp:
    tracing:
      export:
        # Disabled unless an endpoint is configured, so a missing collector cannot noisily fail.
        enabled: ${OTLP_TRACES_ENABLED:false}
  metrics:
    tags:
      application: meridian
      environment: ${DEPLOYMENT_ENVIRONMENT:local}
  prometheus:
    metrics:
      export:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local

logging:
  structured:
    format:
      console: ""
