name: Backend

on:
  push:
    branches: [main]
    paths: ['meridian/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['meridian/**', '.github/workflows/backend.yml']

# A superseded run has nothing to tell us; cancel it rather than queue behind it.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: meridian

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers starts a real PostgreSQL for the context tests. GitHub-hosted Ubuntu runners
      # ship Docker, so this needs no service container — the tests own their database lifecycle.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      # AC-NFR-03 requires the pipeline to fail on a boundary violation. `build` already runs
      # ModularityTests and BoundaryEnforcementTests, so this step asserts nothing new — it exists
      # so the criterion is visible as a named step in the run, and so a change that stops running
      # them is obvious in the log rather than silent.
      - name: Verify module boundaries (AC-NFR-03, NFR-14)
        run: ./gradlew test --tests '*ModularityTests*' --tests '*BoundaryEnforcementTests*' --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: meridian/build/reports/tests/test
          retention-days: 14

      # The module diagrams are regenerated on every run, so the architecture documentation cannot
      # drift from the code the way a hand-drawn diagram does.
      - name: Upload module documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-documentation
          path: meridian/build/spring-modulith-docs
          retention-days: 14

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Builds the image to prove it still builds. Pushing needs a registry that does not exist
      # yet; see .github/workflows/README.md.
      - name: Build image
        run: ./gradlew bootBuildImage --imageName=meridian:${{ github.sha }} --no-daemon
